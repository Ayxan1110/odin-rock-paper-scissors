<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Rock Paper Scissors</h1>
  <p>First to 5 points wins the game</p>

  <div id="buttons">
    <button data-choice="rock">✊ Rock</button>
    <button data-choice="paper">✋ Paper</button>
    <button data-choice="scissors">✌️ Scissors</button>
  </div>

  <div id="score">
    <span>You: <strong id="human-score">0</strong></span>
    <span>Computer: <strong id="computer-score">0</strong></span>
  </div>

  <p id="result">Make your choice!</p>

  <button id="play-again">Play again</button>

  <script src="script.js"></script>
</body>
</html>
